name: Native builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  signing-available:
    runs-on: ubuntu-latest
    outputs:
      keystore: ${{ steps.check.outputs.keystore }}
    steps:
      - id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "keystore=false" >> "$GITHUB_OUTPUT"
          fi

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x gradlew
        working-directory: android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: vupsrouter-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows-unsigned:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run tauri:build
      - name: Stage installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi |
            ForEach-Object { Copy-Item $_.FullName release-assets/ }
          Get-ChildItem release-assets | Select-Object -ExpandProperty Name
      - uses: actions/upload-artifact@v4
        with:
          name: vupsrouter-windows-unsigned
          path: release-assets/*
          if-no-files-found: error

  android-release:
    needs: signing-available
    if: needs.signing-available.outputs.keystore == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x gradlew
        working-directory: android
      - name: Unpack keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vupsrouter.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/vupsrouter.keystore" >> "$GITHUB_ENV"
      - name: Sign the release build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: vupsrouter-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  github-release:
    needs: [signing-available, windows-unsigned, android-debug, android-release]
    if: >-
      always() && github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.windows-unsigned.result == 'success' &&
      needs.android-debug.result == 'success' &&
      (needs.android-release.result == 'success' || needs.android-release.result == 'skipped')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vupsrouter-*
          path: assets
          merge-multiple: true
      - name: Checksums and asset list
        working-directory: assets
        run: |
          test -n "$(ls -A)" || { echo "no build artifacts found" >&2; exit 1; }
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort |
            xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "VupsRouter $GITHUB_REF_NAME" \
            --verify-tag \
            --notes "Builds produced by .github/workflows/native-builds.yml for tag $GITHUB_REF_NAME.

          Windows installers are **unsigned**: SmartScreen will show \"Windows protected your PC\" on first run. Android `app-debug.apk` is a debug package for testing only, not a Play Store release. A signed release APK is attached only when the Android signing secrets are configured on this repository.

          Verify downloads against \`SHA256SUMS.txt\`. The web app at https://vups-router-three.vercel.app/ is the primary, always-current way to use VupsRouter." \
            assets/*
