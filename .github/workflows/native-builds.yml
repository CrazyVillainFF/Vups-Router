name: Native builds

run-name: Native builds (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to publish as a GitHub Release (for example v1.0.0).
          Leave blank to build artifacts only, without publishing a release.
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: false

# Assets are published under names that do not contain the version, so
# releases/latest/download/<name> stays valid for every future release.
# The version itself lives in the tag, the title, and the notes.
env:
  WINDOWS_EXE_ASSET: VupsRouter-windows-x64-setup.exe
  WINDOWS_MSI_ASSET: VupsRouter-windows-x64.msi
  ANDROID_DEBUG_ASSET: VupsRouter-android-test-debug.apk
  ANDROID_RELEASE_ASSET: VupsRouter-android-release.apk
  # Android resolves updates by package name plus signing certificate, so both
  # are asserted on every build instead of assumed to still be what they were.
  ANDROID_APP_ID: com.vupsrouter.app
  # The release keystore is fixed: rotating it would make every existing install
  # impossible to update, so the release job pins the certificate it must match.
  ANDROID_RELEASE_CERT_SHA256: 486cf30b77ea2cba1ba397b07740fbef62244a8663cc20f91f7c21cd90e2eeb1
  # A truncated upload, an HTML error page saved as .apk and an empty file all
  # look like "a file exists" to a naive check. Real builds are far above these.
  MIN_ARTIFACT_BYTES: 1048576

jobs:
  # ---------------------------------------------------------------------------
  # Capability probes. These report which signing identities exist; they never
  # print a secret value.
  # ---------------------------------------------------------------------------
  signing-available:
    name: Check Android signing secrets
    runs-on: ubuntu-latest
    outputs:
      keystore: ${{ steps.check.outputs.keystore }}
    steps:
      - id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Report presence only; never echo a value.
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "keystore=true" >> "$GITHUB_OUTPUT"
            echo "All four Android signing secrets are set, so a release-signed APK will be built." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "keystore=false" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are missing or incomplete: the signed build is skipped and only the debug test APK is published." >> "$GITHUB_STEP_SUMMARY"
          fi

  windows-signing-available:
    name: Check Windows code-signing secrets
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.probe.outputs.mode }}
      required: ${{ steps.probe.outputs.required }}
    steps:
      - id: probe
        env:
          # Azure Artifact Signing (formerly Trusted Signing): three app
          # registration values as secrets, account/profile/endpoint as vars.
          TENANT_ID: ${{ secrets.AZURE_TRUSTED_CERT_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_TRUSTED_CERT_CLIENT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_TRUSTED_CERT_SUBSCRIPTION_ID }}
          ACCOUNT: ${{ vars.AZURE_TRUSTED_CERT_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_TRUSTED_CERT_PROFILE }}
          # Alternative: a classic Authenticode certificate exported as PFX.
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # Setting this repository variable to "true" turns a missing
          # signature into a hard failure, instead of an honest unsigned build.
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: |
          set -euo pipefail
          required=false
          if [ "$WINDOWS_SIGNING_REQUIRED" = "true" ]; then required=true; fi
          mode=none
          if [ -n "$TENANT_ID" ] && [ -n "$CLIENT_ID" ] && [ -n "$SUBSCRIPTION_ID" ] \
             && [ -n "$ACCOUNT" ] && [ -n "$PROFILE" ]; then
            mode=azure-trusted
          elif [ -n "$PFX" ] && [ -n "$PFX_PASSWORD" ]; then
            mode=pfx
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "required=$required" >> "$GITHUB_OUTPUT"
          {
            echo "### Windows code signing"
            echo
            case "$mode" in
              azure-trusted) echo "Azure Artifact Signing is configured: the installers will be signed and the signature verified before upload." ;;
              pfx)           echo "An Authenticode PFX is configured: the installers will be signed and the signature verified before upload." ;;
              none)
                echo "No Windows code-signing credentials are configured, so the installers stay unsigned and SmartScreen will keep warning."
                echo
                if [ "$required" = "true" ]; then
                  echo "The repository variable \`WINDOWS_SIGNING_REQUIRED\` is set to \`true\`, so this run **fails** rather than publishing unsigned installers."
                else
                  echo "\`WINDOWS_SIGNING_REQUIRED\` is not set, so unsigned installers are published and the release notes say so plainly. See [docs/download-and-native.md](../main/docs/download-and-native.md) for exactly what to add."
                fi ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Windows: build, sign, verify, then hand the checksums to the publish job.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows installers
    runs-on: windows-latest
    needs: windows-signing-available
    # id-token: write lets the signing step exchange this run's OIDC token for
    # an Azure access token. It is inert unless an Azure app registration has
    # been federated with this repository, so granting it unconditionally costs
    # nothing and avoids a duplicated copy of this job under a different
    # permission set.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run tauri:build
      - name: Stage installers under stable asset names
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $bundle = "src-tauri/target/release/bundle"
          $exe = @(Get-ChildItem -Path $bundle -Recurse -Filter "*-setup.exe")
          $msi = @(Get-ChildItem -Path $bundle -Recurse -Filter "*.msi")
          if ($exe.Count -eq 0) { Write-Error "Tauri produced no NSIS installer under $bundle"; exit 1 }
          Copy-Item $exe[0].FullName "release-assets/$env:WINDOWS_EXE_ASSET"
          if ($msi.Count -gt 0) {
            Copy-Item $msi[0].FullName "release-assets/$env:WINDOWS_MSI_ASSET"
          } else {
            Write-Warning "Tauri produced no MSI, so only the NSIS installer will be published."
          }
          Get-ChildItem release-assets | ForEach-Object {
            Write-Host ("{0}  ({1:N0} bytes)" -f $_.Name, $_.Length)
          }

      - name: Locate signtool
        id: signtool
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          $candidates = @()
          $command = Get-Command signtool.exe
          if ($command) { $candidates += $command.Source }
          foreach ($root in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
            if (-not $root) { continue }
            foreach ($pattern in @("$root\Windows Kits\10\bin\*\x64\signtool.exe", "$root\Windows Kits\Next\bin\*\x64\signtool.exe")) {
              $candidates += @(Get-ChildItem -Path $pattern | ForEach-Object FullName)
            }
          }
          # Newest SDK version wins; the sort key is the bin\<version> segment.
          $signtool = $candidates | Where-Object { $_ -and (Test-Path $_) } |
            Sort-Object { [version](($_ -split '\\bin\\')[1] -split '\\')[0] } |
            Select-Object -Last 1
          if (-not $signtool) {
            Write-Host "signtool.exe was not found on this runner."
            "path=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Host "Using signtool: $signtool"
          "path=$signtool" >> $env:GITHUB_OUTPUT

      # Signing happens on the staged bytes, before any checksum is recorded, so
      # the published SHA-256 always describes the file that was actually signed.
      - name: Log in to Azure for Artifact Signing
        if: needs.windows-signing-available.outputs.mode == 'azure-trusted'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_TRUSTED_CERT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TRUSTED_CERT_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_TRUSTED_CERT_SUBSCRIPTION_ID }}
      - name: Sign installers with Azure Artifact Signing
        if: needs.windows-signing-available.outputs.mode == 'azure-trusted'
        uses: azure/artifact-signing-action@v2
        with:
          # The endpoint must match the region the signing account lives in,
          # which is why it is a repository variable and not a constant.
          endpoint: ${{ vars.AZURE_TRUSTED_CERT_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          signing-account-name: ${{ vars.AZURE_TRUSTED_CERT_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\release-assets
          files-folder-filter: exe,msi
          file-digest: SHA256
          # Artifact Signing certificates are only valid for three days, so the
          # RFC 3161 timestamp is what keeps the signature verifiable after that.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign installers with an Authenticode PFX
        if: needs.windows-signing-available.outputs.mode == 'pfx'
        shell: pwsh
        env:
          SIGNTOOL: ${{ steps.signtool.outputs.path }}
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_CERT_TIMESTAMP_URL || 'http://timestamp.acs.microsoft.com' }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:SIGNTOOL) {
            Write-Error "Signing credentials exist but this runner has no signtool.exe, so nothing could be signed."
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP "vupsrouter-authenticode.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            foreach ($file in @(Get-ChildItem release-assets | Where-Object { $_.Extension -in ".exe", ".msi" })) {
              & $env:SIGNTOOL sign /v /fd SHA256 /tr $env:TIMESTAMP_URL /td SHA256 /f $pfx /p $env:PFX_PASSWORD $file.FullName
              if ($LASTEXITCODE -ne 0) { Write-Error "signtool sign failed for $($file.Name)"; exit 1 }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Verify signatures and record checksums
        id: verify
        shell: pwsh
        env:
          SIGNTOOL: ${{ steps.signtool.outputs.path }}
          MODE: ${{ needs.windows-signing-available.outputs.mode }}
          REQUIRED: ${{ needs.windows-signing-available.outputs.required }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-checks | Out-Null
          $files = @(Get-ChildItem release-assets | Where-Object { $_.Extension -in ".exe", ".msi" })
          if ($files.Count -eq 0) { Write-Error "No installer was staged."; exit 1 }
          foreach ($file in $files) {
            if ($file.Length -lt [int]$env:MIN_ARTIFACT_BYTES) {
              Write-Error "$($file.Name) is only $($file.Length) bytes; refusing to publish a truncated installer."
              exit 1
            }
          }
          $signed = "false"
          $publisher = ""
          # These are workflow `env:` entries, so they are only reachable as
          # $env:NAME here. As bare $MODE/$REQUIRED they read as empty, which made
          # every unsigned build take the signing branch and fail this gate.
          if ($env:MODE -ne "none") {
            if (-not $env:SIGNTOOL) {
              Write-Error "Signing was attempted but signtool.exe is unavailable, so no signature could be verified."
              exit 1
            }
            foreach ($file in $files) {
              & $env:SIGNTOOL verify /pa /v $file.FullName
              if ($LASTEXITCODE -ne 0) {
                Write-Error "signtool verify /pa failed for $($file.Name). Refusing to publish an installer that is not verifiably signed."
                exit 1
              }
              $auth = Get-AuthenticodeSignature $file.FullName
              if ($auth.Status -ne "Valid") {
                Write-Error "$($file.Name) reports Authenticode status '$($auth.Status)', not Valid."
                exit 1
              }
              if (-not $publisher) { $publisher = $auth.SignerCertificate.Subject }
              $signed = "true"
              Write-Host "$($file.Name): signature Valid; publisher $publisher"
            }
          } elseif ($env:REQUIRED -eq "true") {
            Write-Error "WINDOWS_SIGNING_REQUIRED is 'true' but no code-signing credentials are configured. Add the Azure Artifact Signing or PFX secrets; unsigned installers must not be published under this setting."
            exit 1
          }
          $checksumLines = @(
            foreach ($file in $files) {
              $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
            }
          )
          # The publish job runs on Linux and feeds these lines to `sha256sum -c`,
          # which treats a carriage return as part of the file name. Out-File on a
          # Windows runner writes CRLF, so both files are written with LF here.
          $envLines = @(
            # Quoted because a certificate subject contains spaces and '=', which
            # the publish job sources as a shell file.
            "WINDOWS_SIGNED=$signed",
            "WINDOWS_PUBLISHER=`"$publisher`"",
            "WINDOWS_SIGNING_MODE=`"$($env:MODE)`""
          )
          # $PWD is spelled out because .NET's own working directory does not
          # follow PowerShell's location, and a relative path here could otherwise
          # write the checksums somewhere the upload step never looks.
          [IO.File]::WriteAllText((Join-Path $PWD "release-checks/windows.sha256"), ($checksumLines -join "`n") + "`n")
          [IO.File]::WriteAllText((Join-Path $PWD "release-checks/windows.env"), ($envLines -join "`n") + "`n")
          Get-Content release-checks/windows.sha256
          $summary = if ($signed -eq "true") {
            "Windows installers: Authenticode-signed, `signtool verify /pa` passed, publisher `$publisher`."
          } else {
            "Windows installers: unsigned (no signing credentials configured). SmartScreen will warn; the release notes say so."
          }
          $summary | Out-File -FilePath release-checks/windows-summary.md -Encoding utf8
      - name: Report the signing status
        shell: pwsh
        run: Get-Content release-checks/windows-summary.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v4
        with:
          name: vupsrouter-windows-assets
          path: release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vupsrouter-windows-checks
          path: release-checks/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android. The debug and release jobs share one verification script so that a
  # build can never be published under looser checks than the other.
  # ---------------------------------------------------------------------------
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare the Android SDK from the runner image
        id: sdk
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo '::error::This runner has no Android SDK at $ANDROID_HOME, so no APK can be built here.'
            echo "The runner image has no Android SDK; this job needs an SDK provisioning step that works on this image." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          SDKMANAGER="$(ls -1 "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          else
            echo "sdkmanager was not found; relying on the SDK packages already installed on the runner." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "platforms:   $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"
          # aapt, apksigner and zipalign all come from the newest build-tools.
          # Without them nothing here can be verified, so the job stops instead
          # of shipping an unchecked APK.
          BUILD_TOOLS="$(ls -1d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$BUILD_TOOLS" ]; then
            echo '::error::No build-tools are installed, so aapt/apksigner/zipalign are unavailable and the APK cannot be verified.'
            exit 1
          fi
          echo "build_tools=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Confirm the Capacitor web assets were copied before packaging
        run: node scripts/check-capacitor-bundle.mjs
      - run: chmod +x gradlew
        working-directory: android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Verify and stage the APK
        working-directory: android
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/verify-android-artifact.mjs" \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --out-dir ../release-assets \
            --checks-dir ../release-checks \
            --asset-name "$ANDROID_DEBUG_ASSET" \
            --expected-app-id "$ANDROID_APP_ID" \
            --min-bytes "$MIN_ARTIFACT_BYTES" \
            --expect-debug-key \
            --build-tools "${{ steps.sdk.outputs.build_tools }}"
      - uses: actions/upload-artifact@v4
        with:
          name: vupsrouter-android-debug-assets
          path: release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vupsrouter-android-debug-checks
          path: release-checks/*
          if-no-files-found: error

  android-release:
    name: Android release-signed APK
    needs: signing-available
    if: needs.signing-available.outputs.keystore == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare the Android SDK from the runner image
        id: sdk
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo '::error::This runner has no Android SDK at $ANDROID_HOME, so no APK can be built here.'
            echo "The runner image has no Android SDK; this job needs an SDK provisioning step that works on this image." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          SDKMANAGER="$(ls -1 "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          else
            echo "sdkmanager was not found; relying on the SDK packages already installed on the runner." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "platforms:   $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"
          BUILD_TOOLS="$(ls -1d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$BUILD_TOOLS" ]; then
            echo '::error::No build-tools are installed, so aapt/apksigner/zipalign are unavailable and the APK cannot be verified.'
            exit 1
          fi
          echo "build_tools=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Confirm the Capacitor web assets were copied before packaging
        run: node scripts/check-capacitor-bundle.mjs
      - run: chmod +x gradlew
        working-directory: android
      - name: Unpack keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vupsrouter.keystore"
          if [ ! -s "$RUNNER_TEMP/vupsrouter.keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file, so no keystore could be opened."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/vupsrouter.keystore" >> "$GITHUB_ENV"
      - name: Sign the release build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # assembleRelease with an unset keystore path produces an *unsigned*
          # APK and still exits 0, so the environment has to be proven here.
          test -n "${ANDROID_KEYSTORE_PATH:-}" || { echo "::error::ANDROID_KEYSTORE_PATH was not set." >&2; exit 1; }
          ./gradlew assembleRelease --no-daemon
        working-directory: android
      - name: Verify and stage the signed APK
        working-directory: android
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/verify-android-artifact.mjs" \
            --apk app/build/outputs/apk/release/app-release.apk \
            --out-dir ../release-assets \
            --checks-dir ../release-checks \
            --asset-name "$ANDROID_RELEASE_ASSET" \
            --expected-app-id "$ANDROID_APP_ID" \
            --expected-cert-sha256 "$ANDROID_RELEASE_CERT_SHA256" \
            --min-bytes "$MIN_ARTIFACT_BYTES" \
            --build-tools "${{ steps.sdk.outputs.build_tools }}"
      - uses: actions/upload-artifact@v4
        with:
          name: vupsrouter-android-release-assets
          path: release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vupsrouter-android-release-checks
          path: release-checks/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publishing. Nothing is attached here that was not verified at build time.
  # ---------------------------------------------------------------------------
  github-release:
    name: Publish GitHub Release
    needs: [windows, android-debug, android-release]
    # Publish whatever actually built: one failing platform must not hold up the
    # other, and nothing is advertised that was not attached.
    if: >-
      always() &&
      (needs.windows.result == 'success' || needs.android-debug.result == 'success') &&
      (needs.android-release.result == 'success' || needs.android-release.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.tag != '')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vupsrouter-*-assets
          path: assets
          merge-multiple: true
          fail-on-unmatched: false
      - uses: actions/download-artifact@v4
        with:
          pattern: vupsrouter-*-checks
          path: checks
          merge-multiple: true
          fail-on-unmatched: false
      - name: Confirm the downloaded bytes are the bytes that were verified
        run: |
          set -euo pipefail
          test -n "$(ls -A assets)" || { echo "no build artifacts were downloaded" >&2; exit 1; }
          shopt -s nullglob
          sums=(checks/*.sha256)
          if [ ${#sums[@]} -eq 0 ]; then
            echo "::error::No build-time checksums were published, so these assets cannot be tied back to a verified build."
            exit 1
          fi
          cat "${sums[@]}" > all.sha256
          (cd assets && sha256sum -c ../all.sha256)
          # An unverified stray file in an assets artifact would otherwise reach
          # users with no trace of where it came from.
          while IFS= read -r name; do
            if ! awk '{ print $2 }' all.sha256 | grep -qxF "$name"; then
              echo "::error::$name was attached but never verified at build time."
              exit 1
            fi
          done < <(find assets -maxdepth 1 -type f -printf '%f\n' | sort)
          echo "Every attached file matches the SHA-256 recorded immediately after signing." >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce the signing policy
        run: |
          set -euo pipefail
          load() { [ -f "$1" ] && . "./$1" || true; }
          load checks/windows.env
          load checks/android-debug.env
          load checks/android-release.env
          if [ "${{ vars.WINDOWS_SIGNING_REQUIRED }}" = "true" ] && [ "${WINDOWS_SIGNED:-false}" != "true" ]; then
            echo "::error::WINDOWS_SIGNING_REQUIRED is 'true' but the Windows artifacts are not signed. Refusing to publish."
            exit 1
          fi
          if [ -f assets/$ANDROID_RELEASE_ASSET ]; then
            if [ "${ANDROID_RELEASE_IS_RELEASE_KEY:-false}" != "true" ]; then
              echo "::error::The release APK is not signed with a non-debug key. Refusing to publish it as a release build."
              exit 1
            fi
          fi
          {
            echo "### Verification performed before publishing"
            echo
            echo "- Windows installers: signed \`${WINDOWS_SIGNED:-false}\` (mode \`${WINDOWS_SIGNING_MODE:-none}\`)"
            if [ -n "${WINDOWS_PUBLISHER:-}" ]; then
              echo "  - publisher: \`${WINDOWS_PUBLISHER}\`"
            fi
            echo "- Debug APK: \`${ANDROID_DEBUG_APP_ID:-not built}\` versionCode \`${ANDROID_DEBUG_VERSION_CODE:-?}\`, signer \`${ANDROID_DEBUG_SIGNER:-?}\`"
            if [ -f checks/android-release.env ]; then
              echo "- Release APK: \`${ANDROID_RELEASE_APP_ID:-?}\` versionCode \`${ANDROID_RELEASE_VERSION_CODE:-?}\`, signer \`${ANDROID_RELEASE_SIGNER:-?}\`"
            else
              echo "- Release APK: not built (the Android signing secrets are not configured)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          test -n "$(ls -A)" || { echo "no build artifacts were downloaded" >&2; exit 1; }
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort |
            xargs -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Write release notes from the assets that exist
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./package.json').version")"
          WINDOWS_SIGNED=false
          WINDOWS_PUBLISHER=""
          if [ -f checks/windows.env ]; then
            # shellcheck disable=SC1090
            . checks/windows.env
          fi
          size_of() {
            awk -v b="$(stat -c %s "assets/$1")" 'BEGIN { printf "%.1f MB", b / 1048576 }'
          }
          {
            echo "VupsRouter $APP_VERSION — native builds produced by \`.github/workflows/native-builds.yml\` for tag \`$RELEASE_TAG\`."
            echo
            # An installer is identified by when it was built, not only by its
            # version: the same version can be rebuilt after a CI fix.
            echo "Built $(date -u '+%Y-%m-%d %H:%M UTC') · run \`$GITHUB_RUN_ID\`."
            echo
            echo "| File | Size | What it is |"
            echo "| --- | --- | --- |"
            if [ -f "assets/$WINDOWS_EXE_ASSET" ]; then
              echo "| \`$WINDOWS_EXE_ASSET\` | $(size_of "$WINDOWS_EXE_ASSET") | Windows x64 installer (Tauri shell + NSIS). |"
            fi
            if [ -f "assets/$WINDOWS_MSI_ASSET" ]; then
              echo "| \`$WINDOWS_MSI_ASSET\` | $(size_of "$WINDOWS_MSI_ASSET") | The same Windows app as an MSI, for managed installs. |"
            fi
            if [ -f "assets/$ANDROID_RELEASE_ASSET" ]; then
              echo "| \`$ANDROID_RELEASE_ASSET\` | $(size_of "$ANDROID_RELEASE_ASSET") | Release-signed APK (Android 6.0+). |"
            fi
            if [ -f "assets/$ANDROID_DEBUG_ASSET" ]; then
              echo "| \`$ANDROID_DEBUG_ASSET\` | $(size_of "$ANDROID_DEBUG_ASSET") | Debug-signed **test** APK. Sideloadable, but not Play-Store eligible and not a production release. |"
            fi
            echo "| \`SHA256SUMS.txt\` | — | SHA-256 checksums for every file above. |"
            echo
            if [ -f "assets/$WINDOWS_EXE_ASSET" ] || [ -f "assets/$WINDOWS_MSI_ASSET" ]; then
              echo "### Windows"
              echo
              if [ "$WINDOWS_SIGNED" = "true" ]; then
                echo "The installers are Authenticode-signed${WINDOWS_PUBLISHER:+ with the certificate \`$WINDOWS_PUBLISHER\`} and timestamped; \`signtool verify /pa\` passed in CI."
                echo
                echo "A valid signature is not the same thing as a trusted reputation. SmartScreen can still warn until the certificate has accumulated download history, so verify the file against \`SHA256SUMS.txt\` before installing."
              else
                echo "The installers are **not code-signed**, so SmartScreen shows \"Windows protected your PC\" on first run: choose **More info → Run anyway**. Check the file against \`SHA256SUMS.txt\` before installing. Code signing (an OV/EV certificate, or Azure Artifact Signing via \`AZURE_TRUSTED_CERT_*\`) is a separate step and is not claimed here."
              fi
              echo
              echo "The desktop app bundles the web client at build time and calls the hosted API, so it needs internet access and only changes when a new release is published."
              echo
            fi
            if [ -f "assets/$ANDROID_DEBUG_ASSET" ]; then
              echo "### Android"
              echo
              echo "The APK wraps the live site at \`https://vups-router-three.vercel.app/chat?native=android\`. Installing it requires allowing apps from this source on the device. If you would rather not sideload, use Chrome's **Add to Home Screen** — same experience, no APK."
              echo
              echo "Android identifies an app by package name **and** signing certificate. If another VupsRouter build is already installed under \`com.vupsrouter.app\` with a different key, Android refuses the update and reports it as \"app not installed\". Uninstall the old one first."
              if [ ! -f "assets/$ANDROID_RELEASE_ASSET" ]; then
                echo
                echo "No release-signed APK is attached: the Android signing secrets are not configured on this repository, so only the debug test build above exists."
              fi
              echo
            fi
            echo "### Permanent download links"
            echo
            echo "These always resolve to the newest release and do not change with the version:"
            echo
            for name in "$WINDOWS_EXE_ASSET" "$WINDOWS_MSI_ASSET" "$ANDROID_RELEASE_ASSET" "$ANDROID_DEBUG_ASSET"; do
              if [ -f "assets/$name" ]; then
                echo "- https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$name"
              fi
            done
            echo
            echo "The web app at https://vups-router-three.vercel.app/ remains the always-current way to use VupsRouter."
          } > release-notes.md
          cat release-notes.md
      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; replacing its assets."
            gh release upload "$RELEASE_TAG" --clobber assets/*
            gh release edit "$RELEASE_TAG" --latest --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --latest \
              --title "VupsRouter $RELEASE_TAG" \
              --notes-file release-notes.md \
              assets/*
          fi
          echo "Published: $(gh release view "$RELEASE_TAG" --json url --jq .url)"
      - name: Explain the usual permission failure
        if: failure()
        run: |
          echo "::error::Release publishing failed. If the log says 'Resource not accessible by integration', the GITHUB_TOKEN is read-only: set Settings → Actions → General → Workflow permissions to 'Read and write permissions', then re-run this workflow (Actions → Native builds → Run workflow, with the tag filled in)."
